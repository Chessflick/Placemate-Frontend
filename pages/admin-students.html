<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlaceMate — Students</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="brand"><div class="brand-dot">🎓</div>PlaceMate</div>
            <div class="sidebar-role">Admin Portal</div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">Management</div>
            <a href="admin-dashboard.html"><span class="icon">🏠</span> Dashboard</a>
            <a href="admin-students.html" class="active"><span class="icon">👥</span> Students</a>
            <a href="admin-companies.html"><span class="icon">🏢</span> Companies</a>
            <a href="admin-jobs.html"><span class="icon">💼</span> Job Postings</a>
            <a href="admin-applications.html"><span class="icon">📋</span> Applications</a>
        </nav>
        <div class="sidebar-bottom">
            <div class="user-info">
                <div class="avatar" style="background:#6366f1;">A</div>
                <div><div style="font-weight:600;color:#e2e8f0;font-size:13px;">Admin</div><div style="font-size:11px;" id="sidebar-email"></div></div>
            </div>
            <div class="logout-btn" onclick="Auth.logout()">🚪 Logout</div>
        </div>
    </aside>

    <div class="main-content">
        <div class="topbar">
            <div class="topbar-title">Students</div>
            <div class="topbar-actions">
                <div class="search-bar">
                    <span>🔍</span>
                    <input type="text" id="search" placeholder="Search students…" oninput="filterStudents()">
                </div>
            </div>
        </div>

        <div class="page-body">
            <div class="card">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Student</th>
                                <th>Roll No.</th>
                                <th>Branch / Year</th>
                                <th>CGPA</th>
                                <th>Phone</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="students-tbody">
                            <tr><td colspan="7" class="loader">Loading…</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="../js/api.js"></script>
<script>
    requireAuth('ADMIN');
    document.getElementById('sidebar-email').textContent = getEmail();

    let allStudents = [];

    async function loadStudents() {
        try {
            allStudents = await AdminAPI.getStudents();
            renderStudents(allStudents);
        } catch (err) {
            showToast(err.message, 'error');
        }
    }

    function filterStudents() {
        const q = document.getElementById('search').value.toLowerCase();
        renderStudents(allStudents.filter(s =>
            (s.fullName || '').toLowerCase().includes(q) ||
            (s.rollNumber || '').toLowerCase().includes(q) ||
            (s.email || '').toLowerCase().includes(q) ||
            (s.branch || '').toLowerCase().includes(q)
        ));
    }

    function renderStudents(list) {
        const tbody = document.getElementById('students-tbody');
        if (!list.length) {
            tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><div class="empty-icon">👥</div><p>No students found</p></div></td></tr>`;
            return;
        }
        tbody.innerHTML = list.map(s => `
            <tr>
                <td>
                    <div style="display:flex;align-items:center;gap:10px;">
                        <div style="width:32px;height:32px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0;">
                            ${(s.fullName || 'S')[0].toUpperCase()}
                        </div>
                        <div>
                            <div style="font-weight:600;">${s.fullName || '—'}</div>
                            <div style="font-size:12px;color:var(--text-muted);">${s.email}</div>
                        </div>
                    </div>
                </td>
                <td>${s.rollNumber || '—'}</td>
                <td>${s.branch || '—'} / ${s.year || '—'}</td>
                <td><strong>${s.cgpa || '—'}</strong></td>
                <td>${s.phoneNumber || '—'}</td>
                <td>${statusBadge(s.placementStatus || 'NOT_PLACED')}</td>
                <td>
                    <button class="btn btn-danger btn-sm" onclick="deleteStudent(${s.id}, '${s.fullName}')">Delete</button>
                </td>
            </tr>
        `).join('');
    }

    async function deleteStudent(id, name) {
        if (!confirm(`Delete student "${name}"? This cannot be undone.`)) return;
        try {
            await AdminAPI.deleteStudent(id);
            showToast('Student deleted', 'success');
            loadStudents();
        } catch (err) {
            showToast(err.message, 'error');
        }
    }

    loadStudents();
</script>
</body>
</html>
