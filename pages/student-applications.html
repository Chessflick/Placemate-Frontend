<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlaceMate — My Applications</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="brand"><div class="brand-dot">🎓</div>PlaceMate</div>
            <div class="sidebar-role">Student Portal</div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">Menu</div>
            <a href="student-dashboard.html"><span class="icon">🏠</span> Dashboard</a>
            <a href="student-jobs.html"><span class="icon">💼</span> Browse Jobs</a>
            <a href="student-applications.html" class="active"><span class="icon">📋</span> My Applications</a>
            <a href="student-profile.html"><span class="icon">👤</span> My Profile</a>
        </nav>
        <div class="sidebar-bottom">
            <div class="user-info">
                <div class="avatar">S</div>
                <div><div style="font-weight:600;color:#e2e8f0;font-size:13px;">Student</div><div style="font-size:11px;" id="sidebar-email"></div></div>
            </div>
            <div class="logout-btn" onclick="Auth.logout()">🚪 Logout</div>
        </div>
    </aside>

    <div class="main-content">
        <div class="topbar">
            <div class="topbar-title">My Applications</div>
        </div>

        <div class="page-body">
            <!-- Filter chips -->
            <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;" id="filter-chips">
                <button class="btn btn-primary btn-sm" onclick="filterByStatus(null, this)">All</button>
                <button class="btn btn-outline btn-sm" onclick="filterByStatus('APPLIED', this)">Applied</button>
                <button class="btn btn-outline btn-sm" onclick="filterByStatus('SHORTLISTED', this)">Shortlisted</button>
                <button class="btn btn-outline btn-sm" onclick="filterByStatus('SELECTED', this)">Selected</button>
                <button class="btn btn-outline btn-sm" onclick="filterByStatus('REJECTED', this)">Rejected</button>
            </div>

            <div class="card">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Company</th>
                                <th>Role</th>
                                <th>Applied On</th>
                                <th>Status</th>
                                <th>Remarks</th>
                            </tr>
                        </thead>
                        <tbody id="apps-tbody">
                            <tr><td colspan="5" class="loader">Loading…</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="../js/api.js"></script>
<script>
    requireAuth('STUDENT');
    document.getElementById('sidebar-email').textContent = getEmail();

    let allApps = [];

    async function loadApps() {
        try {
            allApps = await StudentAPI.getApplications();
            renderApps(allApps);
        } catch (err) {
            showToast(err.message, 'error');
        }
    }

    function filterByStatus(status, btn) {
        document.querySelectorAll('#filter-chips .btn').forEach(b => {
            b.className = 'btn btn-outline btn-sm';
        });
        btn.className = 'btn btn-primary btn-sm';
        const filtered = status ? allApps.filter(a => a.status === status) : allApps;
        renderApps(filtered);
    }

    function renderApps(apps) {
        const tbody = document.getElementById('apps-tbody');
        if (!apps.length) {
            tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><div class="empty-icon">📭</div><p>No applications found</p></div></td></tr>`;
            return;
        }
        tbody.innerHTML = apps.map(a => `
            <tr>
                <td><strong>${a.companyName}</strong></td>
                <td>${a.jobTitle}</td>
                <td>${fmtDateTime(a.appliedAt)}</td>
                <td>${statusBadge(a.status)}</td>
                <td style="color:var(--text-muted);font-size:13px;">${a.adminRemarks || '—'}</td>
            </tr>
        `).join('');
    }

    loadApps();
</script>
</body>
</html>
