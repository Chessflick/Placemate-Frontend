<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlaceMate — My Profile</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="brand"><div class="brand-dot">🎓</div>PlaceMate</div>
            <div class="sidebar-role">Student Portal</div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">Menu</div>
            <a href="student-dashboard.html"><span class="icon">🏠</span> Dashboard</a>
            <a href="student-jobs.html"><span class="icon">💼</span> Browse Jobs</a>
            <a href="student-applications.html"><span class="icon">📋</span> My Applications</a>
            <a href="student-profile.html" class="active"><span class="icon">👤</span> My Profile</a>
        </nav>
        <div class="sidebar-bottom">
            <div class="user-info">
                <div class="avatar" id="sidebar-avatar">S</div>
                <div><div style="font-weight:600;color:#e2e8f0;font-size:13px;" id="sidebar-name">Student</div><div style="font-size:11px;" id="sidebar-email"></div></div>
            </div>
            <div class="logout-btn" onclick="Auth.logout()">🚪 Logout</div>
        </div>
    </aside>

    <div class="main-content">
        <div class="topbar">
            <div class="topbar-title">My Profile</div>
            <div class="topbar-actions">
                <button class="btn btn-primary" onclick="saveProfile()">Save Changes</button>
            </div>
        </div>

        <div class="page-body">
            <div style="display:grid;grid-template-columns:1fr 2fr;gap:20px;" id="profile-layout">
                <!-- Profile card -->
                <div>
                    <div class="card card-body" style="text-align:center;">
                        <div style="width:72px;height:72px;background:var(--primary);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff;margin:0 auto 12px;" id="profile-avatar">S</div>
                        <div style="font-size:18px;font-weight:700;" id="p-name">—</div>
                        <div style="color:var(--text-muted);font-size:13px;" id="p-roll">—</div>
                        <div style="margin-top:10px;" id="p-placement-badge"></div>
                        <div style="margin-top:12px;font-size:13px;color:var(--text-muted);" id="p-email"></div>
                    </div>
                    <div class="card card-body" style="margin-top:16px;">
                        <div style="font-size:13px;color:var(--text-muted);margin-bottom:4px;">Branch</div>
                        <div style="font-weight:600;" id="p-branch">—</div>
                        <div style="font-size:13px;color:var(--text-muted);margin-top:12px;margin-bottom:4px;">Year</div>
                        <div style="font-weight:600;" id="p-year">—</div>
                        <div style="font-size:13px;color:var(--text-muted);margin-top:12px;margin-bottom:4px;">CGPA</div>
                        <div style="font-weight:700;font-size:18px;color:var(--primary);" id="p-cgpa">—</div>
                    </div>
                </div>

                <!-- Edit form -->
                <div class="card card-body">
                    <h3 style="margin-bottom:20px;">Edit Profile</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="f-name">
                        </div>
                        <div class="form-group">
                            <label>Roll Number</label>
                            <input type="text" id="f-roll">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Branch</label>
                            <select id="f-branch">
                                <option>CSE</option><option>ECE</option><option>EEE</option>
                                <option>ME</option><option>CE</option><option>IT</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Year</label>
                            <select id="f-year">
                                <option>1st Year</option><option>2nd Year</option>
                                <option>3rd Year</option><option>4th Year</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>CGPA</label>
                            <input type="number" id="f-cgpa" step="0.01" min="0" max="10">
                        </div>
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="tel" id="f-phone">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Resume URL</label>
                        <input type="url" id="f-resume" placeholder="https://drive.google.com/...">
                    </div>
                    <div class="form-group">
                        <label>Skills <span style="color:var(--text-muted);font-weight:400;">(comma separated)</span></label>
                        <input type="text" id="f-skills" placeholder="Java, Spring Boot, MySQL, React">
                    </div>
                    <div class="form-group">
                        <label>Address</label>
                        <textarea id="f-address" rows="2"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="../js/api.js"></script>
<script>
    requireAuth('STUDENT');
    document.getElementById('sidebar-email').textContent = getEmail();
    document.getElementById('p-email').textContent = getEmail();

    async function loadProfile() {
        try {
            const p = await StudentAPI.getProfile();

            // Sidebar
            document.getElementById('sidebar-name').textContent = p.fullName || 'Student';
            document.getElementById('sidebar-avatar').textContent = (p.fullName || 'S')[0].toUpperCase();

            // Profile card
            document.getElementById('profile-avatar').textContent = (p.fullName || 'S')[0].toUpperCase();
            document.getElementById('p-name').textContent = p.fullName || '—';
            document.getElementById('p-roll').textContent = p.rollNumber || '—';
            document.getElementById('p-branch').textContent = p.branch || '—';
            document.getElementById('p-year').textContent = p.year || '—';
            document.getElementById('p-cgpa').textContent = p.cgpa || '—';
            document.getElementById('p-placement-badge').innerHTML = statusBadge(p.placementStatus || 'NOT_PLACED');

            // Form fields
            document.getElementById('f-name').value   = p.fullName || '';
            document.getElementById('f-roll').value   = p.rollNumber || '';
            document.getElementById('f-branch').value = p.branch || '';
            document.getElementById('f-year').value   = p.year || '';
            document.getElementById('f-cgpa').value   = p.cgpa || '';
            document.getElementById('f-phone').value  = p.phoneNumber || '';
            document.getElementById('f-resume').value = p.resumeUrl || '';
            document.getElementById('f-skills').value = p.skills || '';
            document.getElementById('f-address').value= p.address || '';
        } catch (err) {
            showToast(err.message, 'error');
        }
    }

    async function saveProfile() {
        try {
            const data = {
                fullName:    document.getElementById('f-name').value,
                rollNumber:  document.getElementById('f-roll').value,
                branch:      document.getElementById('f-branch').value,
                year:        document.getElementById('f-year').value,
                cgpa:        parseFloat(document.getElementById('f-cgpa').value) || null,
                phoneNumber: document.getElementById('f-phone').value,
                resumeUrl:   document.getElementById('f-resume').value,
                skills:      document.getElementById('f-skills').value,
                address:     document.getElementById('f-address').value,
            };
            await StudentAPI.updateProfile(data);
            showToast('Profile updated!', 'success');
            loadProfile();
        } catch (err) {
            showToast(err.message, 'error');
        }
    }

    loadProfile();
</script>
</body>
</html>
